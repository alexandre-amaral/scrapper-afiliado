# ============================================================================
# docker-compose.prod.yml — pilha completa na VPS
#
#   agente + painel + Evolution (WhatsApp) + Caddy (HTTPS)
#
# Diferente do docker-compose.yml (que serve ao desenvolvimento local), aqui:
#   - o painel também sobe em container, com login por senha;
#   - o Caddy termina o TLS e é o ÚNICO com portas públicas;
#   - agente e Evolution ficam só na rede interna — nem porta de loopback.
#
# Sempre com --env-file .env.prod:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.prod -f docker-compose.prod.yml exec agent pnpm db:migrate
#   docker compose --env-file .env.prod -f docker-compose.prod.yml logs -f agent
#
# O --env-file é obrigatório: o `env_file:` do serviço só injeta variáveis
# DENTRO do container, enquanto os blocos `environment:` abaixo são
# interpolados pelo compose ANTES disso — e ele só lê `.env` por padrão.
# Sem a flag, o build falha reclamando de AGENT_TOKEN ausente.
#
# Na VPS, o atalho `./deploy.sh` já embute a flag.
# ============================================================================

services:
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env.prod
    restart: unless-stopped
    depends_on:
      - evolution
    environment:
      # A janela de envio (09:00–21:00) usa o relógio LOCAL do container.
      # Sem isto ele roda em UTC e a janela sai 3 horas adiantada — o agente
      # para de enviar às 18h do Brasil sem nenhum erro visível.
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      # SQLite + sessão criptografada do portal de afiliados
      - ./data:/app/data
    networks:
      - internal
    # Sem `ports`: quem fala com o agente é o painel, pela rede interna.

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - agent
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      # Alcança o agente pelo nome do serviço na rede interna do compose.
      - AGENT_URL=http://agent:3001
      - AGENT_TOKEN=${AGENT_TOKEN:?defina AGENT_TOKEN no .env.prod}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?defina DASHBOARD_PASSWORD no .env.prod}
      - DASHBOARD_SESSION_SECRET=${DASHBOARD_SESSION_SECRET:?defina DASHBOARD_SESSION_SECRET no .env.prod}
    networks:
      - internal
    # Sem `ports`: quem expõe é o Caddy.

  # Postgres exigido pela Evolution API v2 (sem ele: "Database provider invalid").
  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${EVOLUTION_POSTGRES_DB:-evolution}
      - POSTGRES_USER=${EVOLUTION_POSTGRES_USER:-evolution}
      - POSTGRES_PASSWORD=${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env.prod}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - internal
    # Sem `ports`: só a Evolution fala com o banco.

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      - evolution-postgres
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env.prod}
      - SERVER_URL=http://evolution:8080
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=public
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      # Versão do WhatsApp Web usada pelo Baileys — desatualizada = QR não gera.
      # Atualize se o QR voltar a falhar (veja https://wppconnect.io/whatsapp-versions/).
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION:-2.3000.1023204200}
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - internal
    # Sem `ports`: a Evolution NUNCA é exposta publicamente.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados emitidos pelo Let's Encrypt — persistir evita reemitir a
      # cada restart e bater no limite de emissões deles.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMINIO=${DOMINIO:?defina DOMINIO no .env.prod}
    depends_on:
      - dashboard
    networks:
      - internal

networks:
  internal:

volumes:
  evolution_instances:
  evolution_postgres:
  caddy_data:
  caddy_config:
